<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title description">
  <title id="title">Legal document RAG: index, query, and evaluate</title>
  <desc id="description">644 legal documents become overlapping chunks and document cards, embedded with OpenAI and stored in separate local Chroma collections. The contract description selects one card, and the legal question retrieves five chunks from that contract. With no excerpts, the chain abstains without calling the model. Otherwise gpt-4o-mini answers with quoted, cited clauses or abstains. Ten stratified questions are evaluated with two retrieval metrics and four Ragas metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52677d"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #183047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52677d; }
      .stage { font-size: 20px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 15px; fill: #52677d; }
      .node { fill: #ffffff; stroke: #c5d4e1; stroke-width: 1.5; }
      .store { fill: #e4f3f0; stroke: #73ada2; stroke-width: 1.5; }
      .flow { fill: none; stroke: #52677d; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="1060" rx="20" fill="#f7fafc"/>
  <text x="40" y="48" class="title">Legal Document RAG</text>
  <text x="40" y="78" class="subtitle">Contract-aware retrieval with cited answers</text>

  <rect x="20" y="102" width="1160" height="280" rx="16" fill="#edf3fa" stroke="#d8e3ef"/>
  <text x="42" y="137" class="stage">01 / INDEX</text>
  <text x="225" y="137" class="subtitle">Build once for a fixed corpus and configuration</text>

  <rect x="45" y="194" width="190" height="107" rx="12" class="node"/>
  <text x="140" y="228" text-anchor="middle" class="heading">644 documents</text>
  <text x="140" y="256" text-anchor="middle" class="body">LegalBench-RAG</text>
  <text x="140" y="282" text-anchor="middle" class="small">Stored locally</text>

  <path d="M235 247 H274" class="flow"/>
  <rect x="280" y="194" width="190" height="107" rx="12" class="node"/>
  <text x="375" y="228" text-anchor="middle" class="heading">Clean text</text>
  <text x="375" y="256" text-anchor="middle" class="body">Keep casing, negation</text>
  <text x="375" y="282" text-anchor="middle" class="small">Track character offsets</text>

  <path d="M470 247 H493 V211 H519" class="flow"/>
  <path d="M493 247 V310 H519" class="flow"/>
  <rect x="525" y="166" width="250" height="90" rx="12" class="node"/>
  <text x="650" y="196" text-anchor="middle" class="heading">63,914 chunks</text>
  <text x="650" y="223" text-anchor="middle" class="body">1,500 chars / overlap 200</text>
  <text x="650" y="245" text-anchor="middle" class="small">Recursive text splitting</text>
  <rect x="525" y="270" width="250" height="80" rx="12" class="node"/>
  <text x="650" y="301" text-anchor="middle" class="heading">644 document cards</text>
  <text x="650" y="329" text-anchor="middle" class="body">Filename + first 1,500 chars</text>

  <path d="M775 211 H899" class="flow"/>
  <path d="M775 310 H899" class="flow"/>
  <text x="839" y="196" text-anchor="middle" class="small">Embed</text>
  <text x="839" y="295" text-anchor="middle" class="small">Embed</text>
  <rect x="905" y="166" width="250" height="90" rx="12" class="store"/>
  <text x="1030" y="201" text-anchor="middle" class="heading">Chroma / chunks</text>
  <text x="1030" y="232" text-anchor="middle" class="body">Clause evidence</text>
  <rect x="905" y="270" width="250" height="80" rx="12" class="store"/>
  <text x="1030" y="301" text-anchor="middle" class="heading">Chroma / cards</text>
  <text x="1030" y="329" text-anchor="middle" class="body">Document routing</text>
  <text x="42" y="365" class="small">OpenAI text-embedding-3-small / 1,536 dimensions / two local collections</text>

  <rect x="20" y="402" width="1160" height="421" rx="16" fill="#eef7f4" stroke="#d3e6df"/>
  <text x="42" y="436" class="stage">02 / QUERY</text>
  <text x="225" y="436" class="subtitle">Reuse the card and chunk collections</text>

  <rect x="45" y="462" width="285" height="93" rx="12" class="node"/>
  <text x="187" y="493" text-anchor="middle" class="heading">Split the query</text>
  <text x="187" y="519" text-anchor="middle" class="body">Consider &lt;contract&gt;; &lt;question&gt;</text>
  <text x="187" y="543" text-anchor="middle" class="small">Description + legal question</text>

  <path d="M330 508 H389" class="flow"/>
  <rect x="395" y="462" width="300" height="93" rx="12" class="store"/>
  <text x="545" y="493" text-anchor="middle" class="heading">Route via Chroma cards</text>
  <text x="545" y="519" text-anchor="middle" class="body">Description selects top 1 card</text>
  <text x="545" y="543" text-anchor="middle" class="small">Closest match to the description</text>

  <path d="M695 508 H754" class="flow"/>
  <rect x="760" y="462" width="395" height="93" rx="12" class="store"/>
  <text x="957" y="493" text-anchor="middle" class="heading">Search Chroma chunks</text>
  <text x="957" y="519" text-anchor="middle" class="body">Question embedding / top 5</text>
  <text x="957" y="543" text-anchor="middle" class="small">Only the routed contract's chunks</text>

  <path d="M957 555 V632 H771" class="flow"/>
  <rect x="395" y="584" width="370" height="95" rx="12" class="node"/>
  <text x="580" y="621" text-anchor="middle" class="heading">Any excerpts found?</text>
  <text x="580" y="651" text-anchor="middle" class="body">Up to five chunks from one contract</text>

  <path d="M480 679 V702 H260 V717" class="flow"/>
  <path d="M680 679 V702 H930 V717" class="flow"/>
  <text x="322" y="695" text-anchor="middle" class="small">No</text>
  <text x="850" y="695" text-anchor="middle" class="small">Yes</text>
  <rect x="45" y="723" width="430" height="78" rx="12" fill="#fff6e8" stroke="#d8b47c" stroke-width="1.5"/>
  <text x="260" y="754" text-anchor="middle" class="heading">Abstain</text>
  <text x="260" y="782" text-anchor="middle" class="body">The model is not called</text>
  <rect x="705" y="723" width="450" height="78" rx="12" class="node"/>
  <text x="930" y="754" text-anchor="middle" class="heading">gpt-4o-mini / temperature 0</text>
  <text x="930" y="782" text-anchor="middle" class="body">Quoted, cited answer or abstention</text>

  <rect x="20" y="843" width="1160" height="168" rx="16" fill="#f1eef9" stroke="#ded8ed"/>
  <text x="42" y="877" class="stage">03 / EVALUATE</text>
  <text x="260" y="877" class="subtitle">Saved results from ten evaluated questions</text>
  <rect x="45" y="897" width="300" height="92" rx="12" class="node"/>
  <text x="195" y="928" text-anchor="middle" class="heading">Stratified / seed 42</text>
  <text x="195" y="956" text-anchor="middle" class="body">3 NDA + 4 CUAD + 3 MAUD</text>
  <text x="195" y="978" text-anchor="middle" class="small">10 valid samples per metric</text>
  <path d="M345 943 H384" class="flow"/>
  <rect x="390" y="897" width="320" height="92" rx="12" class="node"/>
  <text x="550" y="928" text-anchor="middle" class="heading">Retrieval overlap</text>
  <text x="550" y="956" text-anchor="middle" class="body">Hit@5 0.900 / MRR@5 0.623</text>
  <text x="550" y="978" text-anchor="middle" class="small">Overlap with the reference text</text>
  <rect x="745" y="897" width="410" height="92" rx="12" class="node"/>
  <text x="950" y="925" text-anchor="middle" class="heading">Ragas</text>
  <text x="950" y="951" text-anchor="middle" class="body">Faithfulness 0.802 / Relevancy 0.525</text>
  <text x="950" y="977" text-anchor="middle" class="body">Context precision 0.757 / Recall 0.871</text>
  <text x="40" y="1040" class="small">Viewing saved outputs is offline. Execution sends data to OpenAI and incurs costs.</text>
</svg>
